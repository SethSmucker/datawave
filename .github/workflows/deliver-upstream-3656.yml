name: deliver-upstream-3656

# One-shot delivery of the attested 3656-large-doc-protection head to
# NationalSecurityAgency/datawave. Requires the UPSTREAM_PAT repository
# secret (classic PAT, public_repo, collaborator on the target repo).
# The push is pinned two ways: it refuses to run if the fork branch has
# moved off the attested commit, and force-with-lease refuses if the
# upstream branch is not at the expected pre-delivery head.

on:
  push:
    branches:
      - claude/datawave-token-scope-mwdr04
  workflow_dispatch:

permissions: {}

env:
  ATTESTED_HEAD: b31bb69ec20ef5cc97712b697dba9deb23954b08
  UPSTREAM_LEASE: f8e63604e4e18cb5babfa6ecea8ee022a1db5a72
  BRANCH: 3656-large-doc-protection

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Push attested commit upstream (lease-pinned)
        env:
          UPSTREAM_PAT: ${{ secrets.UPSTREAM_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$UPSTREAM_PAT" ]; then
            echo "::error::UPSTREAM_PAT secret is not set (repo Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
          git clone --bare --single-branch --branch "$BRANCH" \
            https://github.com/SethSmucker/datawave repo.git
          cd repo.git
          head=$(git rev-parse "refs/heads/$BRANCH")
          if [ "$head" != "$ATTESTED_HEAD" ]; then
            echo "::error::fork branch moved: $head != attested $ATTESTED_HEAD — aborting"
            exit 1
          fi
          auth=$(printf 'x-access-token:%s' "$UPSTREAM_PAT" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            push https://github.com/NationalSecurityAgency/datawave \
            "$ATTESTED_HEAD:refs/heads/$BRANCH" \
            --force-with-lease="refs/heads/$BRANCH:$UPSTREAM_LEASE"
          echo "delivered $ATTESTED_HEAD to NationalSecurityAgency/datawave $BRANCH"
